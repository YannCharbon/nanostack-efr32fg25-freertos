# S6: LGTK rotation in minutes instead of months (appended to wsbrd_p1.conf.in with --extra).
# Lifetime of each LGTK 6 min; the next LGTK is installed at 50 % of the active one's
# lifetime (3 min) and activated 6/3 = 2 min before the active one expires (at 4 min).
lgtk_expire_offset = 6
lgtk_new_install_required = 50
lgtk_new_activation_time = 3
